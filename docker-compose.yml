services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bipesend
      POSTGRES_USER: bipesend
      POSTGRES_PASSWORD: bipesend_dev
    ports:
      - "5432:5432"
    volumes:
      - bipesend-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipesend -d bipesend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bipesend-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bipesend-minio:/data

volumes:
  bipesend-postgres:
  bipesend-redis:
  bipesend-minio:
