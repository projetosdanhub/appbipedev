services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bipesend
      POSTGRES_USER: bipesend
      POSTGRES_PASSWORD: bipesend_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bipesend-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipesend -d bipesend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bipesend-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bipesend-minio:/data

  evolution:
    image: evoapicloud/evolution-api:latest
    command: ["node", "./dist/src/main.js"]
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - SERVER_PORT=8080
      - DEL_INSTANCE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://bipesend:bipesend_dev@postgres:5432/bipesend?schema=public
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=BipesendLocalDevApiKey123
      - REDIS_URI=redis://redis:6379/0
      - REDIS_GLOBAL_PREFIX=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bipesend-evolution:/evolution/instances
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "3443:443"
      - "3080:80"
    volumes:
      - ./infra/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bipesend-postgres:
  bipesend-redis:
  bipesend-minio:
  bipesend-evolution:
