<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F5" />
      <stop offset="50%" stop-color="#F5EBE6" />
      <stop offset="100%" stop-color="#EDE0D8" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FAF5F2" />
      <stop offset="70%" stop-color="#F1E4DC" />
      <stop offset="100%" stop-color="#E2CEC2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#997715" />
    </linearGradient>
    <linearGradient id="pumpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAEAEA" />
      <stop offset="100%" stop-color="#BFBFBF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#8C6D58" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle podium ring -->
  <ellipse cx="200" cy="355" rx="120" ry="24" fill="#E4D3C5" opacity="0.6" />
  <ellipse cx="200" cy="350" rx="90" ry="16" fill="#D9C2B0" opacity="0.4" />

  <!-- Bottle Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Pump Dispenser Head -->
    <path d="M 182 100 L 182 82 C 182 78 185 75 190 75 L 210 75 C 215 75 218 78 218 82 L 218 100 Z" fill="url(#pumpGrad)" />
    <!-- Spout -->
    <path d="M 188 78 C 170 78 156 82 148 86 C 145 88 145 92 148 93 C 156 96 170 94 188 90 Z" fill="url(#pumpGrad)" />
    <circle cx="147" cy="89" r="3.5" fill="#999" />
    <!-- Gold Ring Collar -->
    <rect x="175" y="100" width="50" height="14" rx="3" fill="url(#goldGrad)" />
    <rect x="173" y="114" width="54" height="6" rx="2" fill="#B38918" />

    <!-- Main Bottle Body -->
    <rect x="135" y="120" width="130" height="215" rx="24" fill="url(#bottleGrad)" />
    
    <!-- Glass Highlight reflection -->
    <path d="M 148 135 L 158 135 L 158 320 L 148 315 Z" fill="#FFFFFF" opacity="0.65" />
    
    <!-- Minimalist Label -->
    <rect x="152" y="170" width="96" height="110" rx="8" fill="#FFFFFF" opacity="0.9" />
    <rect x="156" y="174" width="88" height="102" rx="6" fill="none" stroke="#E5D3C5" stroke-width="1" />
    
    <!-- Label Typography -->
    <text x="200" y="202" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#B38918" text-anchor="middle" letter-spacing="3">BIUTI</text>
    <text x="200" y="222" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#2B2118" text-anchor="middle" letter-spacing="1">SATIN</text>
    <text x="200" y="236" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#8C7769" text-anchor="middle" letter-spacing="2">BODY LOTION</text>
    <line x1="180" y1="244" x2="220" y2="244" stroke="#D4AF37" stroke-width="0.8" />
    <text x="200" y="258" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#A89485" text-anchor="middle">ROSE &amp; ARGAN OIL</text>
    <text x="200" y="268" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#A89485" text-anchor="middle">200 ml • 6.7 fl oz</text>
  </g>
</svg>
