worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $host $bipesend_upstream {
    default "";
    app.localhost http://host.docker.internal:3001;
    admin.localhost http://host.docker.internal:3002;
    www.localhost http://host.docker.internal:3000;
    api.localhost http://host.docker.internal:4000;
    hooks.localhost http://host.docker.internal:4000;
  }

  resolver 127.0.0.11 ipv6=off valid=30s;

  server {
    listen 443 ssl;
    http2 on;
    server_name localhost *.localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/deny-sensitive-files.conf;

    location / {
      if ($bipesend_upstream = "") { return 444; }
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_pass $bipesend_upstream;
    }
  }

  server {
    listen 80;
    server_name localhost *.localhost;
    return 308 https://$host:3443$request_uri;
  }
}
