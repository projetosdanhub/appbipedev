[project]
name = "bipesend-ai-service"
version = "0.1.0"
description = "Microsservico Python/FastAPI de IA e Agentes do BipeSend com suporte a Gemini AI e OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
    "TTS>=0.22.0",
    "torch>=2.1.2",
    "torchaudio>=2.1.2",
    "transformers>=4.40.0,<4.50.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "boto3>=1.34.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
providers = [
    "google-genai>=0.1.0",
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.extra-build-dependencies]
pandas = ["setuptools<70.0.0"]
